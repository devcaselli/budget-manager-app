<div class="vdc-head" mat-dialog-title>
  <div>
    <h2 class="vdc-title">Descartar <em>alterações?</em></h2>
    <p class="vdc-subtitle">Você tem mudanças não salvas</p>
  </div>
  <button class="vdc-close" type="button" mat-icon-button (click)="cancel()" aria-label="Fechar">
    <mat-icon>close</mat-icon>
  </button>
</div>

<mat-dialog-content class="vdc-body">
  <p class="vdc-message">
    Suas alterações no formulário ainda não foram salvas. Se continuar, elas serão perdidas.
  </p>
</mat-dialog-content>

<mat-dialog-actions class="vdc-actions" align="end">
  <button mat-button type="button" (click)="cancel()">Continuar editando</button>
  <button mat-flat-button class="vdc-discard-btn" type="button" (click)="confirm()">
    <mat-icon aria-hidden="true">delete_outline</mat-icon>
    Descartar alterações
  </button>
</mat-dialog-actions>
