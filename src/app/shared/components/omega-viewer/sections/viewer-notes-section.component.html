<div class="vns__root">
  <div class="vns__head">
    <h4 class="vns__title">Notas</h4>
    @if (isEditable() && !editing()) {
      <button class="ew-btn ew-btn--ghost vns__edit-btn" type="button" (click)="startEdit()">
        Editar
      </button>
    }
  </div>

  @if (editing()) {
    @if (form(); as notesForm) {
      <form class="vns__form" [formGroup]="notesForm" (ngSubmit)="submit()">
        @if (saveError(); as message) {
          <div class="ew-alert" role="alert">
            <span>{{ message }}</span>
          </div>
        }

        <textarea
          class="ew-textarea vns__textarea"
          formControlName="details"
          rows="4"
          placeholder="Adicione uma nota..."
        ></textarea>

        <div class="vns__actions">
          <button class="ew-btn ew-btn--ghost" type="button" (click)="onCancel()">Cancelar</button>
          <button class="ew-btn ew-btn--primary" type="submit" [disabled]="saving()">
            {{ saving() ? 'Salvando...' : 'Salvar' }}
          </button>
        </div>
      </form>
    }
  } @else {
    @if (detail().details; as details) {
      <p class="vns__text">{{ details }}</p>
    } @else {
      <p class="vns__empty">Sem notas.</p>
    }
  }
</div>
