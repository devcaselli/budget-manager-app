<div class="vrc-head" mat-dialog-title>
  <div>
    <h2 class="vrc-title">Revert <em>payment?</em></h2>
    <p class="vrc-subtitle">Payment from {{ data.dateLabel }}</p>
  </div>
  <button class="vrc-close" type="button" mat-icon-button (click)="cancel()" aria-label="Close">
    <mat-icon>close</mat-icon>
  </button>
</div>

<mat-dialog-content class="vrc-body">
  <p class="vrc-message">
    @if (data.bodyOverride) {
      {{ data.bodyOverride }}
    } @else {
      This action creates a reversal payment for the payment from {{ data.dateLabel }}. The
      original payment will be marked as reverted and cannot be reverted again.
    }
  </p>
</mat-dialog-content>

<mat-dialog-actions class="vrc-actions" align="end">
  <button mat-button type="button" (click)="cancel()">Cancel</button>
  <button mat-flat-button class="vrc-confirm-btn" type="button" (click)="confirm()">
    <mat-icon aria-hidden="true">undo</mat-icon>
    Revert payment
  </button>
</mat-dialog-actions>
