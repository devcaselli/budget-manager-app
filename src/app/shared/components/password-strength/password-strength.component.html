<div class="ew-pw-strength" aria-hidden="true">
  <i [style.width.%]="strengthPercent()" [style.background]="strengthColor()"></i>
</div>

<div class="ew-pw-rules" aria-label="Password requirements">
  @for (rule of rules(); track rule.label) {
    <div [class.ew-ok]="rule.met">{{ rule.label }}</div>
  }
</div>
