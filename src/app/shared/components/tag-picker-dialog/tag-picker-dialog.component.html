<div class="tpd-head" mat-dialog-title>
  <div>
    <h2 class="tpd-title">Manage <em>tags</em></h2>
    <p class="tpd-subtitle">Select every tag that applies</p>
  </div>
  <button class="tpd-close" type="button" mat-icon-button (click)="cancel()" aria-label="Close">
    <mat-icon>close</mat-icon>
  </button>
</div>

<mat-dialog-content class="tpd-body">
  @if (rows.length === 0) {
    <div class="ew-empty">No tags yet. Create one from the Tags page first.</div>
  } @else {
    <!-- D11: design's tags modal leads with a search field. Structural, not decorative:
         the list is a 2-level hierarchy that runs well past a screenful. -->
    <input
      class="ew-input ew-input--boxed tpd-search"
      type="search"
      placeholder="Search tag"
      aria-label="Search tag"
      [value]="query()"
      (input)="onQueryInput($event)"
    />

    @if (visibleRows().length === 0) {
      <div class="ew-empty">No tags match "{{ query() }}".</div>
    }

    <ul class="tpd-list" role="group" aria-label="Available tags">
      @for (row of visibleRows(); track row.tag.id) {
        <li class="tpd-row" [class.tpd-row--subtag]="row.isSubtag">
          <label class="tpd-checkbox" [class.tpd-checkbox--subtag]="row.isSubtag">
            <input
              class="tpd-checkbox-input"
              type="checkbox"
              [formControl]="selection.controls[row.controlIndex]"
            />
            <span class="tpd-checkbox-box" aria-hidden="true">
              @if (selection.controls[row.controlIndex].value) {
                <mat-icon>check</mat-icon>
              }
            </span>
            <span class="tpd-checkbox-label" [class.tpd-checkbox-label--subtag]="row.isSubtag">
              {{ row.tag.name }}
            </span>
          </label>
        </li>
      }
    </ul>
  }
</mat-dialog-content>

<mat-dialog-actions class="tpd-actions" align="end">
  <button class="ew-btn ew-btn--ghost" type="button" (click)="cancel()">Cancel</button>
  <button class="ew-btn ew-btn--primary" type="button" (click)="confirm()">Save tags</button>
</mat-dialog-actions>
