<div class="wrd-head" mat-dialog-title>
  <div>
    <h2 class="wrd-title" [class.wrd-title--positive]="data.tone === 'positive'">
      {{ data.titlePrefix }} <em>{{ data.titleEmphasis }}</em>
    </h2>
    <p class="wrd-subtitle">{{ data.subtitle }}</p>
  </div>
  <button class="wrd-close" type="button" mat-icon-button (click)="cancel()" aria-label="Close">
    <mat-icon>close</mat-icon>
  </button>
</div>

<mat-dialog-content class="wrd-body">
  <p class="wrd-message">
    {{ data.messagePrefix }} <strong>{{ data.walletName }}</strong> {{ data.messageSuffix }}
  </p>
</mat-dialog-content>

<mat-dialog-actions class="wrd-actions" align="end">
  <button mat-button type="button" (click)="cancel()">Cancel</button>
  <button
    mat-flat-button
    class="wrd-confirm-btn"
    [class.wrd-confirm-btn--positive]="data.tone === 'positive'"
    type="button"
    (click)="confirm()"
  >
    <mat-icon aria-hidden="true">{{ data.confirmIcon }}</mat-icon>
    {{ data.confirmLabel }}
  </button>
</mat-dialog-actions>
