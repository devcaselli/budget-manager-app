<div class="tdd-head" mat-dialog-title>
  <div>
    <h2 class="tdd-title">Delete <em>tag?</em></h2>
    <p class="tdd-subtitle">This action cannot be undone</p>
  </div>
  <button class="tdd-close" type="button" mat-icon-button (click)="cancel()" aria-label="Close">
    <mat-icon>close</mat-icon>
  </button>
</div>

<mat-dialog-content class="tdd-body">
  <p class="tdd-message">
    You are about to remove <strong>{{ data.name }}</strong>.
    @if (data.subtagCount > 0) {
      Its {{ data.subtagCount }} subtag{{ data.subtagCount === 1 ? '' : 's' }} will be removed too.
    }
    This action cannot be undone.
  </p>
</mat-dialog-content>

<mat-dialog-actions class="tdd-actions" align="end">
  <button mat-button type="button" (click)="cancel()">Cancel</button>
  <button mat-flat-button class="tdd-delete-btn" type="button" (click)="confirm()">
    <mat-icon aria-hidden="true">delete_outline</mat-icon>
    Delete tag
  </button>
</mat-dialog-actions>
