<div class="efd-head" mat-dialog-title>
  <div>
    <h2 class="efd-title">Filter <em>expenses</em></h2>
    <p class="efd-subtitle">Card, sort and date range</p>
  </div>
  <button class="efd-close" type="button" mat-icon-button mat-dialog-close aria-label="Close">
    <mat-icon>close</mat-icon>
  </button>
</div>

<mat-dialog-content class="efd-body" [formGroup]="form">
  <div class="ew-field">
    <label for="efd-card">Card</label>
    <select id="efd-card" class="ew-select" formControlName="creditCardId">
      <option value="">All cards</option>
      @for (card of creditCards; track card.id) {
        <option [value]="card.id">{{ card.name }}</option>
      }
    </select>
  </div>

  <div class="ew-field">
    <label for="efd-sort">Sort</label>
    <select id="efd-sort" class="ew-select" formControlName="sortOrder">
      <option value="DATE_DESC">Date · newest</option>
      <option value="DATE_ASC">Date · oldest</option>
      <option
        value="VALUE_ASC"
        [disabled]="isGroupedLayout()"
        [title]="isGroupedLayout() ? 'Groups are always ordered by date — switch to Table to sort by value' : ''"
      >
        Value · lowest
      </option>
      <option
        value="VALUE_DESC"
        [disabled]="isGroupedLayout()"
        [title]="isGroupedLayout() ? 'Groups are always ordered by date — switch to Table to sort by value' : ''"
      >
        Value · highest
      </option>
    </select>
    @if (showValueSortHint()) {
      <p class="efd-hint">Groups are ordered by date; value sort applies inside each day.</p>
    }
  </div>

  <div class="efd-date-range">
    <div class="ew-field">
      <label for="efd-start">From</label>
      <input id="efd-start" class="ew-input" type="date" formControlName="startDate" />
    </div>
    <div class="ew-field">
      <label for="efd-end">To</label>
      <input id="efd-end" class="ew-input" type="date" formControlName="endDate" />
    </div>
  </div>

  <label class="efd-toggle-row" for="efd-unhidden">
    <span class="efd-toggle-text">
      <span class="efd-toggle-title">Show hidden items</span>
      <span class="efd-toggle-sub">
        Purchases that became an installment plan, or were 100% passed on via a share.
      </span>
    </span>
    <input type="checkbox" id="efd-unhidden" formControlName="unhidden" />
  </label>
</mat-dialog-content>

<mat-dialog-actions class="efd-actions" align="end">
  <button class="ew-btn ew-btn--primary" type="button" (click)="close()">Done</button>
</mat-dialog-actions>
