<div class="rbdd-head" mat-dialog-title>
  <div>
    <h2 class="rbdd-title">Remove <em>reserve?</em></h2>
    <p class="rbdd-subtitle">Soft delete</p>
  </div>
  <button class="rbdd-close" type="button" (click)="cancel()" aria-label="Close">
    <mat-icon>close</mat-icon>
  </button>
</div>

<mat-dialog-content class="rbdd-body">
  <p class="rbdd-message">
    You are about to remove
    <strong>{{ data.description }}</strong>.
  </p>
  <p class="rbdd-message">
    This is a soft delete &mdash; the reserved budget stops loading into upcoming
    wallets, but its amount history is preserved.
  </p>
</mat-dialog-content>

<mat-dialog-actions class="rbdd-actions" align="end">
  <button class="rbdd-cancel-btn" type="button" (click)="cancel()">Cancel</button>
  <button class="rbdd-confirm-btn" type="button" (click)="confirm()">
    <mat-icon aria-hidden="true">delete</mat-icon>
    Remove reserve
  </button>
</mat-dialog-actions>
