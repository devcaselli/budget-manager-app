<div class="prd__root" cdkDrag cdkDragRootElement=".mat-mdc-dialog-container" cdkDragBoundary=".cdk-overlay-container">
  <div class="prd__head" mat-dialog-title cdkDragHandle>
    <h2 class="prd__title">Review <em>imports</em></h2>
    <button class="prd__close" type="button" mat-dialog-close aria-label="Close">×</button>
  </div>

  <mat-dialog-content class="prd__body">
    <app-pending-review-page />
  </mat-dialog-content>

  <mat-dialog-actions class="prd__actions" align="end">
    <button class="ew-btn ew-btn--ghost" type="button" mat-dialog-close>Close</button>
  </mat-dialog-actions>
</div>
