<div class="pending-review-page">
  <div class="ew-page-head">
    <div>
      <div class="ew-eyebrow">Review imports</div>
      <h1 class="ew-page-title">Pending <em>imports.</em></h1>
      <p class="ew-page-sub">Review, edit, or discard before confirming as expenses.</p>
    </div>
  </div>

  @if (errorMessage()) {
    <div class="ew-alert" role="alert">{{ errorMessage() }}</div>
  } @else if (confirmSummary(); as summary) {
    @if (hasConfirmFailures()) {
      <div class="ew-alert" role="alert">{{ summary }}</div>
    } @else {
      <div class="prp-confirm-note" role="status">{{ summary }}</div>
    }
  }

  @if (isLoading()) {
    <p class="ew-empty">Loading…</p>
  } @else {
    <app-pending-review-list
      [items]="items()"
      [errorsById]="confirmErrorsById()"
      (rename)="onRename($event)"
      (toggleInstallment)="onToggleInstallment()"
      (setInstallmentNumber)="onSetInstallmentNumber($event)"
      (discard)="onDiscard($event)"
      (confirmSelected)="onConfirmSelected($event)"
    />
  }
</div>
