<div class="bed-head" mat-dialog-title>
  <div>
    <h2 class="bed-title">Edit <em>bullet</em></h2>
    <p class="bed-subtitle">Wallet · {{ data.walletDescription }}</p>
  </div>
  <button class="bed-close" type="button" mat-icon-button (click)="cancel()" aria-label="Close">
    <mat-icon>close</mat-icon>
  </button>
</div>

<mat-dialog-content class="bed-body">
  <form class="ew-form" [formGroup]="form" (ngSubmit)="confirm()">
    <div class="ew-field">
      <label for="bed-description">Description</label>
      <input
        id="bed-description"
        class="ew-input"
        formControlName="description"
        placeholder="e.g. Groceries"
      />
    </div>
    <div class="ew-field">
      <label for="bed-budget">Cap</label>
      <input
        id="bed-budget"
        class="ew-input"
        type="number"
        min="0.01"
        step="0.01"
        formControlName="budget"
        placeholder="R$ 0.00"
      />
    </div>
    <p class="bed-hint">
      Changing the cap re-adjusts the remaining amount and the wallet pool automatically.
    </p>
  </form>
</mat-dialog-content>

<mat-dialog-actions class="bed-actions" align="end">
  <button mat-button type="button" (click)="cancel()">Cancel</button>
  <button mat-flat-button class="bed-save-btn" type="button" (click)="confirm()">
    <mat-icon aria-hidden="true">check</mat-icon>
    Save changes
  </button>
</mat-dialog-actions>
